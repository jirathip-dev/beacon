# #8: archive the Beacon iPhone app (app + widget) and upload it to TestFlight from CI; copied from Cooee's recipe.
# No local Xcode, no fastlane, no .p12: Apple manages the distribution certificate and profiles (cloud signing through
# the App Store Connect API key). Uploads run only on `main`. The ASC_* secrets live in the `testflight` environment, which only
# `main` may deploy from: pull_request and fork runs can't read them. docs/testflight.md has the owner's one-time steps.
name: apple-testflight
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/apple-testflight.yml", "scripts/asc-token.swift"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-testflight
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      # `runner` isn't available in a job-level env, so the temp paths go through $GITHUB_ENV.
      - name: temp paths
        run: |
          { echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"; echo "LOG=$RUNNER_TEMP/xcodebuild.log"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: App Store Connect (bundle ids, App Group, team, app, next build number)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          token=$(swift scripts/asc-token.swift)
          echo "::add-mask::$token"
          api() { curl -gsS --fail-with-body -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.appstoreconnect.apple.com/v1/$1" "${@:2}"; }
          pbx=app/Beacon.xcodeproj/project.pbxproj
          # The project holds the app's id and the widget's (app id + .widget): pick the app's by name, not by order.
          ids=$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \(.*\);/\1/p' "$pbx" | sort -u)
          bundle=dev.jirathip.beacon
          group=group.dev.jirathip.beacon
          for id in "$bundle" "$bundle.widget"; do
            grep -qx "$id" <<< "$ids" || { echo "::error::$pbx has no PRODUCT_BUNDLE_IDENTIFIER $id"; exit 1; }
          done
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' "$pbx" | head -1)
          # Registers the id if missing and turns on its App Groups capability; sets $seed to the team. Not run in $(...),
          # where bash drops -e.
          register() {
            local id=$1 name=$2 rec body rid
            rec=$(api "bundleIds?filter[identifier]=$id&fields[bundleIds]=identifier,seedId" | jq -c --arg b "$id" '.data | map(select(.attributes.identifier == $b))[0] // empty')
            if [ -z "$rec" ]; then
              body=$(jq -n --arg b "$id" --arg n "$name" '{data: {type: "bundleIds", attributes: {identifier: $b, name: $n, platform: "IOS"}}}')
              rec=$(api bundleIds -X POST -d "$body" | jq -c .data)
              echo "registered the bundle id $id"
            fi
            rid=$(jq -r .id <<< "$rec")
            if ! api "bundleIds/$rid/bundleIdCapabilities" | jq -e '.data | any(.attributes.capabilityType == "APP_GROUPS")' > /dev/null; then
              body=$(jq -n --arg r "$rid" '{data: {type: "bundleIdCapabilities", attributes: {capabilityType: "APP_GROUPS"}, relationships: {bundleId: {data: {type: "bundleIds", id: $r}}}}}')
              if ! api bundleIdCapabilities -X POST -d "$body" > /dev/null; then
                echo "::error::The API key couldn't turn on App Groups for $id. Once, by hand: developer.apple.com → Certificates, Identifiers & Profiles → Identifiers → App Groups → + → $group; then under Identifiers tick App Groups on $bundle and $bundle.widget and assign $group to both. Then re-run this workflow."
                return 1
              fi
              echo "turned on App Groups for $id"
            fi
            seed=$(jq -r .attributes.seedId <<< "$rec")
          }
          register "$bundle.widget" "beacon widget"
          register "$bundle" beacon
          team=$seed
          echo "::add-mask::$team"
          app=$(api "apps?filter[bundleId]=$bundle&fields[apps]=bundleId" | jq -r --arg b "$bundle" '.data | map(select(.attributes.bundleId == $b))[0].id // empty')
          if [ -z "$app" ]; then
            echo "::error::No App Store Connect app for $bundle. Create it once (Apps → + → New App): platform iOS, name Beacon, primary language English (U.S.), bundle id $bundle, SKU beacon-ios, user access Full Access. Then re-run this workflow."
            exit 1
          fi
          latest=$(api "builds?filter[app]=$app&sort=-uploadedDate&limit=1&fields[builds]=version" | jq -r '.data[0].attributes.version // "0"')
          { echo "TEAM=$team"; echo "APP=$app"; echo "VERSION=$version"; echo "BUILD=$((latest + 1))"; } >> "$GITHUB_ENV"
      - name: archive (cloud signing)
        working-directory: app
        run: >-
          xcodebuild archive -skipMacroValidation -project Beacon.xcodeproj -scheme Beacon -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Beacon.xcarchive" -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD"
          INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO 2>&1 | tee -a "$LOG"
      - name: upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Beacon.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee -a "$LOG"
      - name: summary
        run: |
          { echo "### Beacon $VERSION ($BUILD) uploaded to TestFlight"
            echo "Apple processes it for a few minutes, then it shows in TestFlight on the phone."
            echo "[TestFlight in App Store Connect](https://appstoreconnect.apple.com/apps/$APP/testflight/ios)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: explain a signing failure
        if: failure()
        run: |
          touch "$LOG"
          if grep -qiE 'cloud signing permission|no signing certificate|not have permission' "$LOG"; then
            echo "::error::The App Store Connect API key can't cloud-sign. Give the key the Admin role (App Store Connect → Users and Access → Integrations → Team Keys), or ask for another signing route; this workflow adds no fallback secret."
          fi
          if grep -qiE 'error:.*(app ?group|application-groups)' "$LOG"; then
            echo "::error::Signing couldn't use the App Group group.dev.jirathip.beacon. Once, by hand: developer.apple.com → Certificates, Identifiers & Profiles → Identifiers → App Groups → + → group.dev.jirathip.beacon; then under Identifiers tick App Groups on dev.jirathip.beacon and dev.jirathip.beacon.widget and assign the group to both. Then re-run this workflow."
          fi
          # The artifact is not masked like the job log: scrub the key id, issuer id and team before upload.
          for s in "$ASC_KEY_ID" "$ASC_ISSUER_ID" "${TEAM:-}"; do
            [ -n "$s" ] && sed -i '' "s/$s/***/g" "$LOG"
          done
          true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
      - name: remove the key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
