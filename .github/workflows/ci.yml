name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: rust-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      - run: cargo deny --locked check

  line-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/line-cap.sh
      - run: sh scripts/line-cap.test.sh
      - name: Lesson checks (shadow, never fail)
        run: |
          if ! sh scripts/lessons/screen-body.sh > "$RUNNER_TEMP/screen-body.log" 2>&1; then
            { echo "### would-fail: screen-body"; echo '```'; cat "$RUNNER_TEMP/screen-body.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          app=true
          if git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/files"; then
            grep -qE '^(app/|\.github/workflows/|\.swiftlint\.yml$)' "$RUNNER_TEMP/files" || app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  swift:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/dd
            ~/Library/Developer/Xcode/DerivedData
          key: swift-${{ runner.os }}-${{ hashFiles('app/Beacon.xcodeproj/project.pbxproj', 'app/BeaconKit/Package.swift') }}
          restore-keys: swift-${{ runner.os }}-
      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
            unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
            echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          fi
      - run: swiftlint lint --strict
      - name: Pick an iPhone simulator
        run: echo "SIM=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')" >> "$GITHUB_ENV"
      - name: Build app
        run: xcodebuild -project app/Beacon.xcodeproj -scheme Beacon -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Built app carries the AppIcon
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Beacon.app"
          test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$app/Info.plist")" = AppIcon
          xcrun assetutil --info "$app/Assets.car" | grep '"Name" : "AppIcon"'
          ls -l "$app"/AppIcon*.png
      - name: Test BeaconKit
        working-directory: app/BeaconKit
        run: xcodebuild -scheme BeaconKit -destination "id=$SIM" OTHER_SWIFT_FLAGS=-warnings-as-errors test
