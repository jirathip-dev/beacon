name: cap

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: cap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  line-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/line-cap.sh
      - run: sh scripts/line-cap.test.sh
