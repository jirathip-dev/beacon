<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beacon · app icon (#10) · home-screen sheet</title>
<style>
/* The wallpapers, icon squircle and 60 pt grid copy cooee's app-icons sheet (docs/design/app-icons/ai.css). */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0f141c;color:#e8edf3;font:15px/1.3 var(--font);-webkit-font-smoothing:antialiased}
.ic{display:block;width:var(--s,60px);height:var(--s,60px);border-radius:calc(var(--s,60px)*.224);flex:none}
.wp .ic{box-shadow:0 1px 3px #0004}
.pg{display:flex;flex-direction:column;gap:18px;padding:0 16px 32px}
.sb{display:flex;justify-content:space-between;align-items:center;height:54px;padding:0 34px 0 40px;font:600 17px/1 var(--font)}
.lt{margin:2px 16px 12px;font:700 34px/1.15 var(--font)}
.wp{position:relative;padding:20px 18px 24px;border-radius:28px;overflow:hidden}
.wp.d{background:radial-gradient(120% 80% at 20% 0,#2c3a5a,transparent 60%),radial-gradient(90% 70% at 100% 100%,#3a2a4a,transparent 60%),#121826;color:#fff}
.wp.l{background:radial-gradient(120% 80% at 10% 0,#f9d9b8,transparent 60%),radial-gradient(90% 70% at 100% 100%,#bfd8ee,transparent 60%),#efe8f2;color:#1d1d1f}
.wp h3{margin:0 0 14px;font:600 13px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hs{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;row-gap:18px}
.ap{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;line-height:1.15;text-align:center}
.wp.d .ap{text-shadow:0 1px 2px #0008}
.ap span{width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{width:1440px;padding:32px 40px 40px}
.bd h1{margin:0;font:700 28px/1.2 var(--font)}.bd h1+p{margin:6px 0 24px;color:#9aa6b4;max-width:1000px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-items:start}
.big{display:flex;flex-direction:column;align-items:center;gap:10px;color:#9aa6b4;font-size:13px}
.big b{color:#e8edf3;font-weight:600}
</style>
</head>
<body>
<script type="module">
// Beacon on each ground, among six of cooee's icons (copied unchanged into ref/), on a dark and a light wallpaper.
const BEACON = [['icons/beacon-navy.svg', 'Navy'], ['icons/beacon-teal.svg', 'Teal']];
const COOEE = [['modern-laughing', 'Laughing'], ['garden-monstera', 'Monstera'], ['kitchen-head-chef', 'Head chef'],
  ['bush-roo', 'Roo'], ['garden-sunflower', 'Sunflower'], ['bush-koala', 'Koala']].map(([f, n]) => [`ref/${f}.svg`, n]);
// Each Beacon sits in the first row beside cooee icons, so it is judged in the pack, not alone.
const ROWS = [[BEACON[0], COOEE[0], BEACON[1], COOEE[1]], [COOEE[2], COOEE[3], COOEE[4], COOEE[5]]];
const app = ([src, name]) => `<div class="ap"><img class="ic" src="${src}" alt=""><span>${name}</span></div>`;
const wallpaper = (kind, title) => `<div class="wp ${kind}"><h3>${title}</h3><div class="hs">${ROWS.flat().map(app).join('')}</div></div>`;
const f = new URLSearchParams(location.search).get('f') || 'sheet';
document.body.innerHTML = f === 'sheet'
  ? `<div class="sb"><span>9:41</span><span>●●● ▴ ▮</span></div><div class="lt">Beacon icon</div><div class="pg">${wallpaper('d', 'Dark wallpaper')}${wallpaper('l', 'Light wallpaper')}</div>`
  : `<div class="bd"><h1>Beacon app icon · two grounds, one ships</h1><p>A lighthouse, head and shoulders, in cooee's illustrated look. The same drawing on night-sea navy #13263d (cooee Modern's ground) and on deep teal #12303a, at 240 pt and at home-screen size (60 pt) among cooee's icons.</p>
    <div class="cols">${BEACON.map(([src, n]) => `<div class="big"><img class="ic" style="--s:240px" src="${src}" alt=""><b>${n}</b>${src.includes('navy') ? '#13263d' : '#12303a'}</div>`).join('')}${wallpaper('d', 'Dark wallpaper')}${wallpaper('l', 'Light wallpaper')}</div></div>`;
await Promise.all([...document.images].map(i => i.decode()));
document.body.dataset.ready = 1;
</script>
</body>
</html>
